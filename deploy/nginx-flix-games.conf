# Flix Games em https://games.flixfibra.com.br (servidor compartilhado 132.255.110.226).
# Copiar para /etc/nginx/sites-available/flix-games e ligar com symlink em sites-enabled; `nginx -t` antes do reload.
# Portal e jogos: arquivos estáticos em /opt/flix-games/site (montados do commit, ver deploy/LEIAME.md).
# API: FastAPI em 127.0.0.1:8047 (compose.producao.yaml). IP real: real_ip global do servidor (CF-Connecting-IP).

# Login: no máximo 10 tentativas por minuto por IP já no nginx (a API tem as travas por CPF/CNPJ e por IP também)
limit_req_zone $binary_remote_addr zone=flixgames_entrar:10m rate=10r/m;

server {
    listen 80;
    listen [::]:80;
    server_name games.flixfibra.com.br;
    location ^~ /.well-known/acme-challenge/ { root /var/www/flix-games-acme; default_type "text/plain"; try_files $uri =404; }
    location / { return 301 https://$host$request_uri; }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name games.flixfibra.com.br;
    ssl_certificate     /etc/letsencrypt/live/games.flixfibra.com.br/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/games.flixfibra.com.br/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;
    server_tokens off;

    root /opt/flix-games/site;
    gzip on;
    gzip_types text/css application/javascript text/javascript application/json image/svg+xml;

    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Strict-Transport-Security "max-age=31536000" always;

    # ---- API ----
    location = /api/entrar {
        limit_req zone=flixgames_entrar burst=5 nodelay;
        limit_req_status 429;
        proxy_pass http://127.0.0.1:8047;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        client_max_body_size 1m;
        proxy_read_timeout 30s;  # conferência na API Própria tem 10 s de limite; abaixo do corte de ~100 s do Cloudflare
        proxy_send_timeout 30s;
    }
    location /api/ {
        proxy_pass http://127.0.0.1:8047;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        client_max_body_size 1m;
        proxy_read_timeout 30s;  # conferência na API Própria tem 10 s de limite; abaixo do corte de ~100 s do Cloudflare
        proxy_send_timeout 30s;
    }

    # ---- Jogos (iframe isolado, origem "null"): precisam de CORS aberto; arquivos públicos, sem cookie ----
    location /games/ {
        add_header Access-Control-Allow-Origin "*" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Cache-Control "no-cache" always;
        try_files $uri $uri/ =404;
    }

    # ---- Portal ----
    location /assets/ {  # arquivos com hash no nome: podem ficar em cache por muito tempo
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        add_header X-Content-Type-Options "nosniff" always;
        try_files $uri =404;
    }
    location / {
        add_header Cache-Control "no-cache" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Strict-Transport-Security "max-age=31536000" always;
        add_header Content-Security-Policy "frame-ancestors 'self'" always;
        try_files $uri /index.html;
    }
}
