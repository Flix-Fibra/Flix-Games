<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover"
    />
    <meta name="theme-color" content="#0b0b0d" />
    <title>Flix Grid</title>
    <style>
      html, body { margin: 0; height: 100%; background: #0b0b0d; overflow: hidden; }
      body { overscroll-behavior: none; touch-action: none; -webkit-user-select: none; user-select: none;
             -webkit-touch-callout: none; box-sizing: border-box; }
      /* o jogo ocupa a tela toda (até atrás da câmera); só o placar e os botões fogem da área da câmera (lida daqui) */
      #area-segura { position: fixed; visibility: hidden; pointer-events: none; padding: env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left); }
      #game { width: 100%; height: 100%; }
      /* a tela interna tem o tamanho da janela em pixels do aparelho: o canvas ocupa tudo, sem suavizar */
      #game canvas { display: block; width: 100vw !important; height: 100vh !important; image-rendering: pixelated; }
    </style>
  </head>
  <body>
    <div id="game"></div>
    <div id="area-segura"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
