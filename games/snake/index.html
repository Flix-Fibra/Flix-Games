<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover"
    />
    <meta name="theme-color" content="#0b0b0d" />
    <!-- ao adicionar à tela inicial, abre sem barras do navegador (inclusive no iPhone) -->
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <title>Network Snake</title>
    <style>
      /* só o jogo: a página não rola, não arrasta e não puxa para atualizar, em nenhuma direção */
      html, body { margin: 0; width: 100%; height: 100%; height: 100dvh; background: #0b0b0d; overflow: hidden;
                   overscroll-behavior: none; touch-action: none; }
      body { position: fixed; inset: 0; -webkit-user-select: none; user-select: none; -webkit-touch-callout: none;
             -webkit-tap-highlight-color: transparent; padding: env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left); box-sizing: border-box; }
      #game { position: absolute; inset: 0; width: 100%; height: 100%; touch-action: none; }
      canvas { display: block; touch-action: none; }
    </style>
  </head>
  <body>
    <div id="game"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
