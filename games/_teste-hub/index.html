<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Jogo de teste do hub</title>
<!--
  Jogo MÍNIMO para testar o hub (portal) sem depender dos jogos reais.
  Fala o contrato v2 (docs/prompt-inicio-minigames-flix.md, seção 6):
    jogo -> hub: ready, started (runId), gameover (score, durationMs)
    hub  -> jogo: init, restart, pause, resume, mute
  Não é um jogo do catálogo. Pode ser apagado quando os jogos reais existirem.
-->
<style>
  html,body{margin:0;height:100%;background:#0b0b0d;color:#f5f5f7;font:600 15px/1.4 -apple-system,system-ui,sans-serif;overflow:hidden;touch-action:manipulation;user-select:none}
  canvas{display:block;width:100%;height:100%}
  #info{position:fixed;top:12px;left:0;right:0;text-align:center;font-size:28px;font-weight:800;pointer-events:none}
  #msg{position:fixed;inset:auto 0 22%;text-align:center;pointer-events:none;opacity:.85}
  #trapaca{position:fixed;right:10px;bottom:10px;font:inherit;font-size:11px;padding:6px 10px;border-radius:99px;border:1px solid #555;background:#222;color:#aaa}
</style>
</head>
<body>
<canvas id="tela"></canvas>
<div id="info">0</div>
<div id="msg">Toque para começar</div>
<button id="trapaca" type="button" title="Teste: o hub deve recusar">Enviar pontuação absurda</button>
<script>
(function () {
  'use strict';
  var GAME_ID = '_teste-hub';
  var params = new URLSearchParams(location.search);
  // Origem do hub permitida. Nunca '*' em produção (seção 6.4).
  var HUB = params.get('hubOrigin') || '';
  var noIframe = window.parent === window;

  var tela = document.getElementById('tela'), ctx = tela.getContext('2d');
  var info = document.getElementById('info'), msg = document.getElementById('msg');
  var estado = 'aguardando'; // aguardando | jogando | fim
  var pausado = false, mudo = false, cor = '#D4142C';
  var y, vy, pontos, inicio, runId, ultimo;

  function uuid() {
    if (crypto.randomUUID) return crypto.randomUUID();
    var b = crypto.getRandomValues(new Uint8Array(16)); b[6] = (b[6] & 15) | 64; b[8] = (b[8] & 63) | 128;
    var h = Array.prototype.map.call(b, function (x) { return (x + 256).toString(16).slice(1); }).join('');
    return h.slice(0, 8) + '-' + h.slice(8, 12) + '-' + h.slice(12, 16) + '-' + h.slice(16, 20) + '-' + h.slice(20);
  }
  function enviar(m) {
    m.source = 'flix-game'; m.v = 2; m.gameId = GAME_ID;
    if (!noIframe && HUB) window.parent.postMessage(m, HUB);
  }

  function tamanho() { tela.width = innerWidth * devicePixelRatio; tela.height = innerHeight * devicePixelRatio; }
  addEventListener('resize', tamanho); tamanho();

  function preparar() { y = 0.4; vy = 0; pontos = 0; info.textContent = '0'; estado = 'aguardando'; msg.textContent = 'Toque para começar'; }

  function tocar() {
    if (pausado) return;
    if (estado === 'aguardando') {
      estado = 'jogando'; inicio = performance.now(); ultimo = inicio; runId = uuid();
      msg.textContent = 'Toque para não cair';
      enviar({ type: 'started', runId: runId });
    }
    if (estado === 'jogando') vy = -0.9;
  }
  function perder(score) {
    if (estado !== 'jogando') return;
    estado = 'fim';
    msg.textContent = noIframe ? 'Fim! Toque para reiniciar' : 'Fim de jogo';
    // Congela e ESPERA o restart do hub (seção 6.3, passo 4)
    enviar({ type: 'gameover', runId: runId, score: Math.max(0, Math.floor(score)), durationMs: Math.round(performance.now() - inicio) });
  }

  addEventListener('pointerdown', function (e) {
    if (e.target.id === 'trapaca') return;
    if (estado === 'fim' && noIframe) { preparar(); return; } // sem hub: restart próprio (seção 6.3, passo 6)
    tocar();
  });
  document.getElementById('trapaca').addEventListener('click', function () {
    if (estado === 'aguardando') tocar();
    perder(999999999);
  });

  // Mensagens do hub: só da origem permitida e do formato esperado (seção 6.4)
  addEventListener('message', function (e) {
    if (noIframe || e.source !== window.parent || e.origin !== HUB) return;
    var m = e.data;
    if (!m || m.source !== 'flix-hub' || m.v !== 2) return;
    if (m.type === 'init') { mudo = !!m.muted; if (m.avatar && /^#[0-9a-f]{6}$/i.test(m.avatar.cor || '')) cor = m.avatar.cor; }
    else if (m.type === 'restart') preparar();
    else if (m.type === 'pause') pausado = true;
    else if (m.type === 'resume') { pausado = false; ultimo = performance.now(); }
    else if (m.type === 'mute') mudo = !!m.muted;
  });

  function quadro(t) {
    var w = tela.width, h = tela.height;
    if (estado === 'jogando' && !pausado) {
      var dt = Math.min(0.05, (t - ultimo) / 1000); ultimo = t;
      vy += 1.6 * dt; y += vy * dt;
      pontos += dt * 10; info.textContent = String(Math.floor(pontos));
      if (y > 1 || y < -0.05) perder(pontos);
    }
    ctx.fillStyle = '#0b0b0d'; ctx.fillRect(0, 0, w, h);
    ctx.fillStyle = '#26262b'; ctx.fillRect(0, h - 6 * devicePixelRatio, w, 6 * devicePixelRatio);
    ctx.beginPath(); ctx.arc(w / 2, Math.max(0, Math.min(1, y)) * h, 22 * devicePixelRatio, 0, Math.PI * 2);
    ctx.fillStyle = cor; ctx.fill();
    if (pausado) { ctx.fillStyle = 'rgba(0,0,0,.6)'; ctx.fillRect(0, 0, w, h); }
    requestAnimationFrame(quadro);
  }

  preparar();
  requestAnimationFrame(quadro);
  enviar({ type: 'ready', capabilities: { sdkVersion: 'teste-0', avatarTier: 'B', avatarViews: ['portrait'] } });
})();
</script>
</body>
</html>
